[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planspace"
version = "0.1.0"
description = "Execution-grounded evaluation of equivalent embodied plans"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
  "numpy>=1.24",
  "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
